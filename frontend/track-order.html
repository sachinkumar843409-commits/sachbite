<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Track Order - SachBite</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .track-wrap { max-width: 700px; margin: 0 auto; }
  .track-search { display:flex; gap:10px; margin: 20px 0 30px; }
  .track-search input { flex:1; padding: 12px 18px; border:1px solid var(--border); border-radius: 30px; outline:none; font-size:14px; }
  .track-order-card { background:#fff; border:1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .track-order-card .oid { font-weight:800; color:var(--primary); }
  .track-status { margin-top: 10px; display:flex; gap: 8px; flex-wrap: wrap; }
  .track-step { flex:1; text-align:center; font-size:11px; font-weight:700; padding: 8px 4px; border-radius: 8px; background: var(--bg); color: var(--text-gray); }
  .track-step.done { background: var(--primary-light); color: var(--primary); }
  .live-map-box { height: 300px; border-radius: 14px; margin-top: 14px; }
  .live-eta { display:flex; justify-content:space-between; align-items:center; background: var(--primary-light); color: var(--primary); font-weight:700; padding: 12px 16px; border-radius: 12px; margin-top: 12px; font-size: 14px; }
  .emoji-marker { font-size: 24px; text-align: center; }
</style>
</head>
<body>

<header class="topbar" id="headerRoot"></header>

<section class="section container">
  <div class="track-wrap">
    <div class="section-head"><h2>📦 Track Your Order</h2></div>
    <p style="color:var(--text-gray); margin-bottom:10px;">Apna phone number daalein jisse order kiya tha:</p>
    <div class="track-search">
      <input type="text" id="phoneInput" placeholder="Phone number" />
      <button class="btn btn-primary" id="trackBtn">Track</button>
    </div>
    <div id="trackResults"></div>
  </div>
</section>

<footer>© 2026 SachBite. Food delivered with love ❤️ — <span id="footerLocation">Kanti, Muzaffarpur</span></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="js/images.js"></script>
<script src="js/auth.js"></script>
<script src="js/main-cart.js"></script>
<script src="js/customer-layout.js"></script>
<script>renderCustomerHeader("track-order.html");</script>
<script src="js/site-settings.js"></script>
<script src="js/track-order.js"></script>
</body>
</html>
