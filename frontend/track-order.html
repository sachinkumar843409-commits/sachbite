<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Track Order - SachBite</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .track-wrap { max-width: 700px; margin: 0 auto; }
  .track-search { display:flex; gap:10px; margin: 20px 0 30px; }
  .track-search input { flex:1; padding: 12px 18px; border:1px solid var(--border); border-radius: 30px; outline:none; font-size:14px; }
</style>
</head>
<body>

<header class="topbar" id="headerRoot"></header>

<section class="section container">
  <div class="track-wrap">
    <div class="section-head"><h2 data-i18n="track_heading">📦 Track Your Order</h2></div>
    <p style="color:var(--text-gray); margin-bottom:10px;" data-i18n="track_desc">Yahan aapke saare orders (naye se purane) dikhenge.</p>
    <div class="track-search">
      <button class="btn btn-primary" id="trackBtn" data-i18n="track_btn">🔄 Refresh</button>
    </div>
    <div id="trackResults"></div>
  </div>
</section>

<footer>© 2026 SachBite. <span data-i18n="footer_text">Food delivered with love ❤️</span> — <span id="footerLocation">Kanti, Muzaffarpur</span></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/images.js"></script>
<script src="js/auth.js"></script>
<script src="js/main-cart.js"></script>
<script src="js/customer-layout.js"></script>
<script>renderCustomerHeader("track-order.html");</script>
<script src="js/site-settings.js"></script>
<script src="js/track-order.js"></script>
</body>
</html>
