<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/png" href="../icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analytics - SachBite</title>
<link rel="stylesheet" href="../css/dashboard.css" />
<style>
  .panel { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 20px; }
  .panel h3 { font-size: 16px; margin-bottom: 18px; }
  .bar-chart { display: flex; align-items: flex-end; gap: 14px; height: 200px; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bar-fill { width: 100%; max-width: 40px; background: linear-gradient(180deg, var(--primary), #ffb37a); border-radius: 8px 8px 0 0; transition: height 0.4s; }
  .bar-label { font-size: 12px; color: var(--text-gray); margin-top: 8px; }
  .bar-value { font-size: 12px; font-weight: 700; margin-bottom: 4px; }

  .hbar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .hbar-label { width: 140px; font-size: 13px; font-weight: 600; flex-shrink: 0; }
  .hbar-track { flex: 1; background: var(--bg); border-radius: 8px; height: 22px; overflow: hidden; }
  .hbar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #ffb37a); border-radius: 8px; }
  .hbar-value { width: 130px; text-align: right; font-size: 13px; font-weight: 700; flex-shrink: 0; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
</style>
</head>
<body>

<aside class="sidebar" id="sidebarRoot"></aside>

<main class="main">
  <div class="topbar" id="topbarRoot"></div>

  <div class="content">
    <div class="page-head">
      <div>
        <h2>Analytics</h2>
        <p>Aapke business ka performance data.</p>
      </div>
    </div>

    <div class="panel">
      <h3>📈 Last 7 Days Sales</h3>
      <div class="bar-chart" id="salesBarChart"></div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <h3>🔥 Top Selling Items (by quantity)</h3>
        <div id="topItemsChart"></div>
      </div>
      <div class="panel">
        <h3>⏰ Peak Order Hours</h3>
        <div id="peakHoursChart"></div>
      </div>
    </div>

    <div class="panel">
      <h3>💳 Payment Methods Breakdown</h3>
      <div id="paymentMethodsChart"></div>
    </div>
  </div>
</main>

<script src="../js/admin-guard.js"></script>
<script src="../js/layout.js"></script>
<script>
  renderSidebar("analytics.html");
  renderTopbar("Restaurant Dashboard");
</script>
<script src="../js/analytics.js"></script>
</body>
</html>
