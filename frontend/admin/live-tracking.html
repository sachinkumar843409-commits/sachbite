<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/png" href="../icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Tracking - SachBite</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="../css/dashboard.css" />
<style>
  .tracking-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
  #liveMap { height: 560px; border-radius: var(--radius); border: 1px solid var(--border); }
  .live-badge { display:flex; align-items:center; gap:8px; font-size:12px; color: var(--text-gray); font-weight:600; margin-top: 4px; }
  .live-dot { width:8px; height:8px; border-radius:50%; background:#16a34a; animation: pulseDot 1.4s infinite; }
  @keyframes pulseDot { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
  .delivery-list { display: flex; flex-direction: column; gap: 14px; }
  .delivery-card { background:#fff; border:1px solid var(--border); border-radius: var(--radius); overflow:hidden; transition: 0.15s; }
  .delivery-card:hover { border-color: var(--primary); box-shadow: var(--shadow); }
  .dc-top { padding: 16px; }
  .delivery-card .oid { font-weight:800; color: var(--primary); font-size: 14px; }
  .delivery-card .cname { font-weight:700; font-size:14px; margin: 4px 0; }
  .delivery-card .addr { font-size:12px; color:var(--text-gray); margin-bottom:10px; }
  .progress-track { background: var(--bg); border-radius: 8px; height: 8px; overflow:hidden; margin-bottom:6px; }
  .progress-fill { height:100%; background: linear-gradient(90deg, var(--primary), #ffb37a); transition: width 0.6s ease; }
  .delivery-meta { display:flex; justify-content:space-between; font-size:12px; color:var(--text-gray); font-weight:600; }
  .dc-actions { display:flex; border-top: 1px solid var(--border); }
  .dc-btn { flex:1; text-align:center; padding: 10px 8px; font-size:12px; font-weight:700; border:none; background:#fff; cursor:pointer; text-decoration:none; color: var(--text-dark); transition: 0.15s; }
  .dc-btn:hover { background: var(--bg); }
  .dc-call { border-right: 1px solid var(--border); color: var(--primary); }
  .dc-delivered { color: #16a34a; }
  .empty-state { text-align:center; padding: 60px 20px; color: var(--text-gray); }
  @media (max-width: 1000px) { .tracking-layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<aside class="sidebar" id="sidebarRoot"></aside>

<main class="main">
  <div class="topbar" id="topbarRoot"></div>

  <div class="content">
    <div class="page-head">
      <div>
        <h2>🛵 Live Delivery Tracking</h2>
        <p>Abhi jitne bhi orders "Out for Delivery" hain, unki live position.</p>
        <div class="live-badge"><span class="live-dot"></span> Live — Last update: <span id="lastRefreshed">--:--:--</span></div>
      </div>
    </div>

    <div class="tracking-layout">
      <div id="liveMap"></div>
      <div class="delivery-list" id="deliveryList"></div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="../js/admin-guard.js"></script>
<script src="../js/layout.js"></script>
<script>
  renderSidebar("live-tracking.html");
  renderTopbar("Restaurant Dashboard");
</script>
<script src="../js/live-tracking.js"></script>
</body>
</html>
