<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Tracking - SachBite</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="../css/dashboard.css" />
<style>
  .tracking-layout { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
  #liveMap { height: 560px; border-radius: var(--radius); border: 1px solid var(--border); }
  .delivery-list { display: flex; flex-direction: column; gap: 14px; }
  .delivery-card { background:#fff; border:1px solid var(--border); border-radius: var(--radius); padding: 16px; cursor: pointer; transition: 0.15s; }
  .delivery-card:hover, .delivery-card.active { border-color: var(--primary); box-shadow: var(--shadow); }
  .delivery-card .oid { font-weight:800; color: var(--primary); font-size: 14px; }
  .delivery-card .cname { font-weight:700; font-size:14px; margin: 4px 0; }
  .delivery-card .addr { font-size:12px; color:var(--text-gray); margin-bottom:10px; }
  .progress-track { background: var(--bg); border-radius: 8px; height: 8px; overflow:hidden; margin-bottom:6px; }
  .progress-fill { height:100%; background: linear-gradient(90deg, var(--primary), #ffb37a); }
  .delivery-meta { display:flex; justify-content:space-between; font-size:12px; color:var(--text-gray); font-weight:600; }
  .empty-state { text-align:center; padding: 60px 20px; color: var(--text-gray); }
  @media (max-width: 1000px) { .tracking-layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<aside class="sidebar" id="sidebarRoot"></aside>

<main class="main">
  <div class="topbar" id="topbarRoot"></div>

  <div class="content">
    <div class="page-head">
      <div>
        <h2>🛵 Live Delivery Tracking</h2>
        <p>Abhi jitne bhi orders "Out for Delivery" hain, unki live position.</p>
      </div>
    </div>

    <div class="tracking-layout">
      <div id="liveMap"></div>
      <div class="delivery-list" id="deliveryList"></div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="../js/admin-guard.js"></script>
<script src="../js/layout.js"></script>
<script>
  renderSidebar("live-tracking.html");
  renderTopbar("Restaurant Dashboard");
</script>
<script src="../js/live-tracking.js"></script>
</body>
</html>
