<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1280" />
<title>Restaurant - SachBite</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  .rest-banner { position: relative; border-radius: 20px; overflow: hidden; margin-top: 24px; }
  .rest-banner img { width: 100%; height: 260px; object-fit: cover; }
  .rest-info-card { background:#fff; border:1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-top: -50px; margin-left: 24px; margin-right: 24px; position: relative; box-shadow: var(--shadow); }
  .rest-info-card h1 { font-size: 24px; margin-bottom: 6px; }
  .rest-info-card .tags { color: var(--text-gray); margin-bottom: 10px; }
  .rest-info-card .meta { display:flex; gap: 16px; font-weight:600; font-size:14px; color: var(--text-gray); }
  .menu-section { margin-top: 30px; }
  .menu-item-row { display:flex; align-items:center; justify-content:space-between; background:#fff; border:1px solid var(--border); border-radius: 14px; padding: 16px 20px; margin-bottom: 14px; gap: 16px; }
  .menu-item-row .left { display:flex; align-items:center; gap: 14px; }
  .menu-item-row img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; }
  .menu-item-row .name { font-weight:700; font-size:15px; }
  .menu-item-row .price { color: var(--primary); font-weight:700; }
  .menu-item-row button { white-space: nowrap; }
</style>
</head>
<body>

<header class="topbar" id="headerRoot"></header>

<section class="container">
  <div class="rest-banner">
    <img id="restBannerImg" src="" alt="Restaurant" />
  </div>
  <div class="rest-info-card">
    <h1 id="restName">Loading...</h1>
    <div class="tags" id="restTags"></div>
    <div class="meta">
      <span id="restRating"></span>
      <span id="restTime"></span>
      <span class="badge-green" id="restBadge"></span>
    </div>
  </div>

  <div class="menu-section">
    <div class="section-head"><h2 data-i18n="menu_heading">Menu</h2></div>
    <div id="menuList"></div>
  </div>
</section>

<footer style="margin-top:30px;">© 2026 SachBite. <span data-i18n="footer_text">Food delivered with love ❤️</span> — <span id="footerLocation">Kanti, Muzaffarpur</span></footer>

<script src="js/i18n.js"></script>
<script src="js/images.js"></script>
<script src="js/auth.js"></script>
<script src="js/customer-layout.js"></script>
<script>renderCustomerHeader("");</script>
<script src="js/site-settings.js"></script>
<script src="js/main-cart.js"></script>
<script src="js/restaurant.js"></script>
</body>
</html>
