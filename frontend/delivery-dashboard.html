<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Delivery Dashboard - SachBite</title>
<style>
  :root {
    --primary: #ff7a1a; --primary-dark: #e85d04; --text-dark:#1e1e1e; --text-gray:#6b7280;
    --border:#eee; --green:#16a34a; --green-bg:#e9f9ee; --red:#dc2626;
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI", Roboto, Arial, sans-serif; }
  body { background:#faf9f7; color:var(--text-dark); }
  header {
    background:#fff; border-bottom:1px solid var(--border); padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10; flex-wrap:wrap; gap:10px;
  }
  .logo { font-size:20px; font-weight:800; }
  .logo span { color:var(--primary); }
  .header-right { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .online-toggle { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; }
  .switch { position:relative; display:inline-block; width:44px; height:24px; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; cursor:pointer; inset:0; background:#ccc; border-radius:24px; transition:0.2s; }
  .slider::before { content:""; position:absolute; height:18px; width:18px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:0.2s; }
  input:checked + .slider { background:var(--green); }
  input:checked + .slider::before { transform:translateX(20px); }
  .btn-logout { background:#fdeaea; color:var(--red); border:none; padding:8px 16px; border-radius:20px; font-weight:700; font-size:13px; cursor:pointer; }

  .tabs { display:flex; gap:6px; padding:14px 20px 0; background:#fff; border-bottom:1px solid var(--border); overflow-x:auto; }
  .tab-btn {
    padding:10px 16px; border:none; background:transparent; font-weight:700; font-size:13.5px;
    color:var(--text-gray); cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap;
  }
  .tab-btn.active { color:var(--primary); border-bottom-color:var(--primary); }

  .content { padding:22px 20px 60px; max-width:900px; margin:0 auto; }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }

  .card { background:#fff; border:1px solid var(--border); border-radius:14px; padding:18px 20px; margin-bottom:16px; }
  .card h3 { font-size:16px; margin-bottom:14px; }
  .form-group { margin-bottom:14px; }
  .form-group label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  .form-group input, .form-group select { width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px; outline:none; }
  .row-2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:600px) { .row-2 { grid-template-columns:1fr; } }

  .btn { padding:10px 20px; border-radius:24px; border:none; font-weight:700; font-size:13.5px; cursor:pointer; }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-primary:hover { background:var(--primary-dark); }
  .btn-outline { background:#fff; border:1.5px solid var(--border); color:var(--text-dark); }
  .btn-green { background:var(--green); color:#fff; }
  .btn:disabled { opacity:0.6; cursor:not-allowed; }

  .msg { font-size:13px; font-weight:600; margin-top:10px; display:none; }
  .msg.show { display:block; }
  .msg.success { color:var(--green); }
  .msg.error { color:var(--red); }

  .order-card { border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px; }
  .order-card .top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
  .order-card .order-id { font-weight:800; font-size:15px; }
  .order-card .rname { font-size:12.5px; color:var(--primary); font-weight:700; margin-top:2px; }
  .order-card .item-line { font-size:13px; color:var(--text-dark); padding:2px 0; }
  .order-card .addr-block { font-size:13px; color:var(--text-gray); margin:8px 0; line-height:1.5; }
  .order-card .actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .status-chip { font-size:11px; font-weight:700; padding:4px 10px; border-radius:12px; background:#fff4e0; color:#b45309; }
  .status-chip.picked { background:var(--green-bg); color:var(--green); }

  .stat-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-bottom:16px; }
  @media (max-width:600px) { .stat-grid { grid-template-columns:1fr; } }
  .stat-box { background:#fff8f2; border-radius:12px; padding:16px; text-align:center; }
  .stat-box .val { font-size:22px; font-weight:800; color:var(--primary-dark); }
  .stat-box .lbl { font-size:12px; color:var(--text-gray); margin-top:4px; }

  .history-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .history-row:last-child { border-bottom:none; }

  .empty-state { text-align:center; padding:40px 20px; color:var(--text-gray); }
  .gps-banner { background:var(--green-bg); color:var(--green); font-size:12.5px; font-weight:600; padding:10px 14px; border-radius:10px; margin-bottom:14px; }
  .cod-banner { background:#fff4e0; color:#b45309; font-size:13px; font-weight:700; padding:8px 12px; border-radius:8px; margin:8px 0; }
</style>
<link rel="manifest" href="manifest-delivery.json" />
<meta name="theme-color" content="#16a34a" />
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/service-worker.js").catch(() => {});
    });
  }
</script>
</head>
<body>

<header>
  <div class="logo">Sach<span>Bite</span> 🛵 <span style="font-size:12px; color:var(--text-gray); font-weight:600;">Delivery</span></div>
  <div class="header-right">
    <div class="online-toggle">
      <label class="switch">
        <input type="checkbox" id="onlineToggle" />
        <span class="slider"></span>
      </label>
      <span id="onlineLabel">Offline</span>
    </div>
    <span id="partnerNamePill" style="font-size:13px; color:var(--text-gray);"></span>
    <button class="btn-logout" onclick="deliveryLogout()">Logout</button>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="orders">📦 Orders</button>
  <button class="tab-btn" data-tab="earnings">💰 Earnings</button>
  <button class="tab-btn" data-tab="profile">👤 Profile</button>
</div>

<div class="content">

  <!-- ORDERS TAB -->
  <div class="tab-panel active" id="tab-orders">
    <div id="gpsBanner" class="gps-banner" style="display:none;">📍 Live location share ho raha hai...</div>
    <div class="card">
      <h3>Aapke Assigned Orders</h3>
      <div id="ordersList"></div>
    </div>
  </div>

  <!-- EARNINGS TAB -->
  <div class="tab-panel" id="tab-earnings">
    <div class="stat-grid">
      <div class="stat-box"><div class="val" id="todayEarn">₹0</div><div class="lbl">Aaj (<span id="todayCount">0</span> deliveries)</div></div>
      <div class="stat-box"><div class="val" id="weekEarn">₹0</div><div class="lbl">Is hafte (<span id="weekCount">0</span> deliveries)</div></div>
      <div class="stat-box"><div class="val" id="totalEarn">₹0</div><div class="lbl">Total (<span id="totalCount">0</span> deliveries)</div></div>
    </div>
    <div class="card">
      <h3>Delivery History</h3>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- PROFILE TAB -->
  <div class="tab-panel" id="tab-profile">
    <div class="card">
      <h3>Profile</h3>
      <div class="form-group">
        <label for="pName">Naam</label>
        <input type="text" id="pName" />
      </div>
      <div class="row-2">
        <div class="form-group">
          <label for="pPhone">Phone</label>
          <input type="text" id="pPhone" />
        </div>
        <div class="form-group">
          <label for="pVehicle">Vehicle Type</label>
          <select id="pVehicle">
            <option value="Bike">Bike</option>
            <option value="Scooter">Scooter</option>
            <option value="Bicycle">Bicycle</option>
            <option value="On Foot">On Foot</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="pImageFile">Profile Photo</label>
        <input type="file" id="pImageFile" accept="image/*" />
        <div style="margin-top:8px;"><img id="pImagePreview" src="" alt="" style="max-width:100px; border-radius:50%; display:none;" /></div>
      </div>
      <button class="btn btn-primary" id="saveProfileBtn">Save Profile</button>
      <div class="msg" id="profileMsg"></div>
    </div>

    <div class="card">
      <h3>🔑 Change Password</h3>
      <div class="row-2">
        <div class="form-group">
          <label for="curPass">Current Password</label>
          <input type="password" id="curPass" />
        </div>
        <div class="form-group">
          <label for="newPass">New Password</label>
          <input type="password" id="newPass" placeholder="Kam se kam 6 characters" />
        </div>
      </div>
      <button class="btn btn-outline" id="changePassBtn">Password Badlein</button>
      <div class="msg" id="passMsg"></div>
    </div>
  </div>

</div>

<script src="js/delivery-auth.js"></script>
<script src="js/delivery-dashboard.js"></script>
</body>
</html>
