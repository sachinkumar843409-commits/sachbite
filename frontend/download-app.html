<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SachBite App Download</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI", Roboto, Arial, sans-serif; }
  body {
    background: linear-gradient(135deg, #fff6ee, #ffe9d6);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .box { background:#fff; border-radius:24px; padding:40px 32px; text-align:center; max-width:420px; box-shadow:0 10px 40px rgba(0,0,0,0.1); }
  .logo { font-size:26px; font-weight:800; margin-bottom:6px; }
  .logo span { color:#ed7118; }
  h1 { font-size:18px; margin-bottom:20px; color:#444; font-weight:700; }
  img.qr { border:8px solid #fff; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,0.08); }
  .steps { text-align:left; margin-top:24px; font-size:14px; line-height:1.9; color:#333; }
  .steps b { color:#ed7118; }
  .link { margin-top:18px; font-size:13px; color:#6b7280; word-break:break-all; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">Sach<span>Bite</span> 🛵</div>
    <h1>Scan karke App Install Karein</h1>
    <img class="qr" width="220" height="220"
      src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https%3A%2F%2Fsachbite.onrender.com"
      alt="SachBite App QR Code" />

    <div class="steps">
      1. Apne phone ke camera ya QR scanner se ye code scan karein<br/>
      2. SachBite website khul jaayegi<br/>
      3. Screen ke upar <b>"📲 App Install Karein"</b> button dabayein<br/>
      4. App aapke home screen par icon ke roop mein aa jaayegi
    </div>

    <div class="link">sachbite.onrender.com</div>
  </div>
</body>
</html>
