<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Delivery Partner Login - SachBite</title>
<style>
  :root {
    --primary: #ff7a1a;
    --text-dark: #1e1e1e;
    --text-gray: #6b7280;
    --border: #eee;
    --green: #16a34a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #fff6ee, #ffe9d6);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-box {
    background: #fff;
    border-radius: 20px;
    padding: 40px 36px;
    width: 380px;
    max-width: 92vw;
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    text-align: center;
  }
  .logo { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
  .logo span { color: #ed7118; }
  .tagline { font-size: 13px; color: var(--text-gray); margin-bottom: 26px; }
  .form-group { text-align: left; margin-bottom: 16px; }
  .form-group label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
  .form-group input { width:100%; padding: 12px 16px; border:1px solid var(--border); border-radius: 10px; font-size:14px; outline:none; }
  .btn-login { width:100%; background: var(--primary); color:#fff; border:none; padding: 13px; border-radius: 30px; font-weight:700; font-size:15px; cursor:pointer; margin-top: 8px; }
  .btn-login:hover { background: #e85d04; }
  .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
  .error-msg { color:#dc2626; font-size:13px; font-weight:600; margin-top:12px; display:none; }
  .back-link { display:block; margin-top: 18px; font-size: 13px; color: var(--text-gray); text-decoration:none; }
  .note { font-size:12px; color:var(--text-gray); margin-top:16px; background:#f9f9f9; border-radius:8px; padding:10px 12px; text-align:left; }
</style>
<link rel="manifest" href="manifest-delivery.json" />
<meta name="theme-color" content="#16a34a" />
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/service-worker.js").catch(() => {});
    });
  }
</script>
</head>
<body>

<main class="login-box">
  <div class="logo" aria-hidden="true">Sach<span>Bite</span> 🛵</div>
  <div class="tagline">Delivery Partner Dashboard</div>

  <div class="form-group">
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Aapka delivery partner username" />
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Password" />
  </div>

  <button class="btn-login" id="loginBtn">Login</button>
  <div class="error-msg" id="errorMsg"></div>

  <div class="note">Login credentials nahi hain? Ye SachBite admin ke paas se milte hain — unse contact karein.</div>

  <a href="index.html" class="back-link">← Website par wapas jaayein</a>
</main>

<script>
  const API = "/api";

  async function attemptLogin() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const errorMsg = document.getElementById("errorMsg");
    const btn = document.getElementById("loginBtn");
    errorMsg.style.display = "none";

    if (!username || !password) {
      errorMsg.textContent = "Username aur password dono bharein.";
      errorMsg.style.display = "block";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Checking...";

    try {
      const res = await fetch(`${API}/delivery-auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();

      if (!res.ok) {
        errorMsg.textContent = "❌ " + (data.error || "Login fail hua.");
        errorMsg.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Login";
        return;
      }

      sessionStorage.setItem("sachbite_delivery_token", data.token);
      sessionStorage.setItem("sachbite_delivery_name", data.partnerName || "");
      window.location.href = "delivery-dashboard.html";
    } catch (e) {
      errorMsg.textContent = "Server se connect nahi ho paya.";
      errorMsg.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Login";
    }
  }

  document.getElementById("loginBtn").addEventListener("click", attemptLogin);
  document.getElementById("password").addEventListener("keydown", (e) => {
    if (e.key === "Enter") attemptLogin();
  });
</script>
</body>
</html>
